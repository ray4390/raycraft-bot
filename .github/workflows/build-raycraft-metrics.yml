name: Build RayCraft Metrics
on:
  push:
    branches: [main]
    paths:
      - 'paper-metrics/**'
      - '.github/workflows/build-raycraft-metrics.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: paper-metrics/pom.xml
      - name: Compile metrics collector
        run: mvn -B -ntp -f paper-metrics/pom.xml clean package
      - name: Publish verified collector JAR and checksum
        run: |
          set -euo pipefail
          mkdir -p paper-metrics/dist
          cp paper-metrics/target/raycraft-metrics-0.1.0.jar paper-metrics/dist/RayCraftMetrics.jar
          sha256sum paper-metrics/dist/RayCraftMetrics.jar | cut -d ' ' -f1 > paper-metrics/dist/RayCraftMetrics.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper-metrics/dist/RayCraftMetrics.jar paper-metrics/dist/RayCraftMetrics.sha256
          git commit -m "Publish compiled RayCraftMetrics 0.1.0 for production staging"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: raycraft-metrics-unverified
          path: paper-metrics/target/raycraft-metrics-*.jar
          if-no-files-found: error
          retention-days: 14
