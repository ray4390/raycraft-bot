name: Build RayCraft Metrics
on:
  push:
    branches: [main]
    paths:
      - 'paper-metrics/**'
      - '.github/workflows/build-raycraft-metrics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: paper-metrics/pom.xml
      - name: Compile metrics collector
        run: mvn -B -ntp -f paper-metrics/pom.xml clean package
      - uses: actions/upload-artifact@v4
        with:
          name: raycraft-metrics-unverified
          path: paper-metrics/target/raycraft-metrics-*.jar
          if-no-files-found: error
          retention-days: 14
